<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>CSS машинка</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(#dff1ff calc(100% - 80px), #2b2b2b calc(100% - 80px));
    }

   
    .car {
      position: absolute;
      left: 0;
      bottom: 40px;
      width: 200px;
      height: 50px;
      background: #1e6fd9;
      border-radius: 10px;
      transform: translateX(-100%);
      animation: drive 4s linear infinite;
    }

    .car::before {
      content: "";
      position: absolute;
      left: 40px;
      bottom: 100%;
      width: 110px;
      height: 40px;
      background: #1e6fd9;
      border-radius: 20px 20px 0 0;
    }

   
    .car::after {
      content: "";
      position: absolute;
      left: 25px;
      bottom: -20px;
      width: 40px;
      height: 40px;
      background: #111;
      border-radius: 50%;
      box-shadow: 110px 0 #111;
    }

    
    @keyframes drive {
      to {
        transform: translateX(1000vw);
      }
    }
  </style>
</head>
<body>
  <div class="car"></div>
</body>
</html>
